name: build-ios
on:
  push:
    branches: [main]
    paths: ["app/**", "tools/ci-tests/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Synthetic unit tests (no face data, no models)
        run: |
          mkdir -p build
          swiftc -O app/Core/*.swift tools/ci-tests/main.swift -o build/coretests
          build/coretests

  build:
    needs: core-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project InSwapBench.xcodeproj \
            -scheme InSwapBench \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/InSwapBench.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/InSwapBench.xcarchive/Products/Applications/InSwapBench.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/InSwapBench.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/InSwapBench.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: InSwapBench-ipa
          path: InSwapBench.ipa
          retention-days: 14

      - name: Publish to rolling release (direct IPA URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "rolling" --prerelease
          gh release upload latest InSwapBench.ipa --clobber
          gh release edit latest --notes "Build ${GITHUB_RUN_NUMBER} - commit ${GITHUB_SHA::7} - app only, no models or face data"
