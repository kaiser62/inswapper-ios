name: build-ios
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project InSwapBench.xcodeproj \
            -scheme InSwapBench \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/InSwapBench.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/InSwapBench.xcarchive/Products/Applications/InSwapBench.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/InSwapBench.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/InSwapBench.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: InSwapBench-ipa
          path: InSwapBench.ipa
          retention-days: 14
